<div class="play-controls">
  <div class="game__actions">
    <button type="button" class="game__button game__toggle" data-event="click:_togglePlay">${state.label}</button>
    <button type="button" class="game__button game__new" data-event="click:_newGame" ${state.canStartOver ? '' : 'hidden'}>New game</button>
  </div>
  ${keys === null ? '' : html`<p class="game__keys">${keys}</p>`}
  <p class="game__status${state.over ? ' game__status--over' : ''}" role="status">${state.status}</p>
</div>
