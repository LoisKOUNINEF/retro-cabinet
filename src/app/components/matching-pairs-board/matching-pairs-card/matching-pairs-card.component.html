<button
  type="button"
  class="matching-pairs-board__card matching-pairs-board__card--${card.state}${card.cursor ? ' matching-pairs-board__card--cursor' : ''}"
  data-index="${card.index}"
  data-focus-key="card-${card.index}"
  data-event="click:_select"
  aria-label="${card.label}"
  ${card.disabled ? 'disabled' : ''}
>${cardFace(card)}</button>
