<div class="touch-controls${button ? '' : ' touch-controls--centred'}">
  ${nutinIf(layout.pad === 'stick', html`<div class="touch-controls__stick" role="presentation">
      <div class="touch-controls__knob"></div>
    </div>`).nutinElse(html`<div class="touch-controls__cross" data-catalog="cross"></div>`)}
  ${nutinIf(button !== undefined, () => html`<button type="button" class="touch-controls__action" aria-label="${layout.autoFire ? 'Hold fire' : button!.label}">${button!.label}</button>`)}
</div>
