<div class="touch-controls${button ? '' : ' touch-controls--centred'}">
  ${layout.pad === 'stick'
    ? html`<div class="touch-controls__stick" role="presentation">
        <div class="touch-controls__knob"></div>
      </div>`
    : html`<div class="touch-controls__cross" data-catalog="cross"></div>`}
  <button type="button" class="touch-controls__action" aria-label="${layout.autoFire ? 'Hold fire' : button?.label}" data-optional>${button?.label}</button>
</div>
