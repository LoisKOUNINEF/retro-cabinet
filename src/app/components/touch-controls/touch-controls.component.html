<div class="touch-controls">
  <button type="button" class="touch-controls__pause" aria-label="Play or pause" data-event="click:_togglePlay">⏯</button>
  ${layout.pad === 'cross'
    ? html`<div class="touch-controls__cross" data-catalog="cross"></div>`
    : html`<div class="touch-controls__stick" role="presentation">
        <div class="touch-controls__knob"></div>
      </div>`}
  <button type="button" class="touch-controls__action" data-optional>${layout.action?.label}</button>
</div>
