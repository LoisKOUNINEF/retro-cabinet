<div class="rpsls-board">
  <div class="rpsls-board__duel" aria-hidden="true">
    ${side('You', config.player, false, sideOutcome(config, 'player'))}
    <span class="rpsls-board__versus">vs</span>
    ${side('Opponent', config.ai, config.phase === 'shaking', sideOutcome(config, 'ai'))}
  </div>
  <ul class="rpsls-board__hands" aria-label="Your hand" data-catalog="hands"></ul>
  <ul class="rpsls-board__rules" aria-label="Rules">
    ${RULES.map((rule) => html`<li>${rule}</li>`)}
  </ul>
</div>
