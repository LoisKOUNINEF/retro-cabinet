<div class="game">
  <header class="game__header">
    <a class="game__back" href="/" data-event="click:_goHome">← Games</a>
    <h1 class="game__title">${game.title}</h1>
  </header>
  <div class="game__layout">
    <div class="game__stage"><div data-component="board"></div></div>
    <aside class="game__panel">
      ${game.preview ? html`
        <section class="game__section game__next" aria-labelledby="game-next-title">
          <h2 class="game__section-title" id="game-next-title">Next</h2>
          <div class="game__preview"><div data-component="preview"></div></div>
        </section>` : ''}
      <section class="game__section" aria-labelledby="game-play-title">
        <h2 class="game__section-title" id="game-play-title">Play</h2>
        <div data-component="play"></div>
      </section>
      <section class="game__section" aria-labelledby="game-stats-title">
        <h2 class="game__section-title" id="game-stats-title">Stats</h2>
        <div data-component="stats"></div>
      </section>
      ${hasOptions ? html`<div data-component="options"></div>` : ''}
      <section class="game__section"><div data-component="scores"></div></section>
    </aside>
  </div>
  <div data-component="touch"></div>
</div>
