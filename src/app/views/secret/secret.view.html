<div class="secret">
  <h1 class="secret__title">Noughts &amp; Crosses</h1>
  <div class="secret__layout">
    <div data-component="board"></div>
    <aside class="secret__panel">
      ${options.map((option) => html`
        <label class="secret__option">${option.label}
          <select data-option="${option.key}" data-event="change:_setOption:@dataset:option,@target">
            ${option.choices.map((choice) => html`<option value="${choice.value}">${choice.label}</option>`)}
          </select>
        </label>`)}
      <p class="secret__status" role="status"></p>
      <p class="secret__tally"></p>
      <button type="button" class="secret__new" data-event="click:_newRound">New round</button>
      <a class="secret__back" href="/" data-event="click:_goHome">Back to games</a>
    </aside>
  </div>
</div>
