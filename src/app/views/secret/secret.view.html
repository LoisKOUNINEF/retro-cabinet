<div class="game secret">
  <header class="game__header">
    <a class="game__back" href="/" data-event="click:_goHome">← Games</a>
    <h1 class="game__title">Noughts &amp; Crosses</h1>
  </header>
  <div class="game__layout">
    <div class="game__stage"><div data-component="board"></div></div>
    <aside class="game__panel">
      <section class="game__section" aria-labelledby="secret-play-title">
        <h2 class="game__section-title" id="secret-play-title">Play</h2>
        <p class="game__status secret__status" role="status"></p>
        <div class="game__actions">
          <button type="button" class="game__button game__toggle secret__new" data-event="click:_newRound">New round</button>
        </div>
      </section>
      <section class="game__section" aria-labelledby="secret-tally-title">
        <h2 class="game__section-title" id="secret-tally-title">Tally</h2>
        <dl class="game__stats secret__tally">
          <dt>Wins</dt><dd data-tally="wins">0</dd>
          <dt>Draws</dt><dd data-tally="draws">0</dd>
          <dt>Losses</dt><dd data-tally="losses">0</dd>
        </dl>
      </section>
      <fieldset class="game__section game__options" aria-labelledby="secret-options-title">
        <h2 class="game__section-title" id="secret-options-title">⚙ Options</h2>
        ${options.map((option) => html`
          <label class="game__option">${option.label}
            <select data-option="${option.key}" data-event="change:_setOption:@dataset:option,@target">
              ${option.choices.map((choice) => html`<option value="${choice.value}">${choice.label}</option>`)}
            </select>
          </label>`)}
      </fieldset>
    </aside>
  </div>
</div>
